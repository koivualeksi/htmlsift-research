<text x="58" y="470" font-size="12.5"><tspan fill="#1b1f24" font-weight="700">Out-of-language, not in-domain. </tspan><tspan fill="#565d66">A model that never saw the language lands 3 to 6 points under that language's oracle ceiling; Polish and</tspan></text>
<text x="58" y="488" font-size="12.5" fill="#565d66">Russian are hardest. The metric is reimplemented from the SIGIR 2025 paper (no scorer ships with the corpus) and is not yet established as</text>
<text x="58" y="506" font-size="12.5" fill="#565d66">like-for-like with the zero-shot column.</text>
