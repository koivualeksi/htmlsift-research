<text x="58" y="550" font-size="12.5"><tspan fill="#1b1f24" font-weight="700">Cut the encoder, take the cheapest depth on the plateau. </tspan><tspan fill="#565d66">Frozen quality peaks near 12 layers and falls off by 22. Structural features add</tspan></text>
<text x="58" y="568" font-size="12.5" fill="#565d66">about 1 to 2 points to the frozen readout (0.891 with, 0.884 without, at the peak) but nothing once the encoder fine-tunes (0.8940 vs</text>
<text x="58" y="586" font-size="12.5" fill="#565d66">0.8942 at 10 layers). Fine-tuning lifts every depth above both frozen curves and flattens them, so the keeper takes the shallowest, 10</text>
<text x="58" y="604" font-size="12.5" fill="#565d66">layers.</text>
